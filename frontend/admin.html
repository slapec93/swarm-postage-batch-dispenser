<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispenser Admin</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header-inner wide">
        <img src="logo.svg" alt="Swarm" />
        <div>
          <div class="title">Postage Batch Dispenser</div>
          <div class="subtitle">Admin</div>
        </div>
        <div class="spacer"></div>
        <button id="logout" class="secondary small" type="button" hidden>Log out</button>
      </div>
    </header>

    <form id="login-form" class="card login" hidden>
      <h1>Admin login</h1>
      <input id="username" placeholder="Username" autocomplete="username" required />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <p id="login-error" class="error"></p>
    </form>

    <main id="dashboard" class="wide" hidden>
      <section class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 16px">
          <h2 style="margin: 0">Mode</h2>
          <span id="mode-badge" class="badge"></span>
        </div>
        <form id="settings-form" class="row">
          <select id="mode">
            <option value="manual">Manual</option>
            <option value="auto">Auto</option>
          </select>
          <label>Auto until <input id="auto-until" type="datetime-local" /></label>
          <button type="submit">Save</button>
        </form>
        <p id="mode-status" class="muted" style="margin: 12px 0 0"></p>
      </section>

      <section class="card">
        <h2>Pool</h2>
        <div class="stats">
          <div class="stat">
            <div id="pool-available" class="value">0</div>
            <div class="label">Available</div>
          </div>
          <div class="stat">
            <div id="pool-syncing" class="value">0</div>
            <div class="label">Syncing</div>
          </div>
          <div class="stat">
            <div id="pool-assigned" class="value">0</div>
            <div class="label">Assigned</div>
          </div>
          <div class="stat">
            <div id="pool-target" class="value">0</div>
            <div class="label">Target pool size</div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Dispenser wallet</h2>
        <p id="wallet-error" class="error"></p>
        <div id="wallet">
          <div class="field">
            <h3>Address</h3>
            <code id="wallet-address"></code>
          </div>
          <div class="stats">
            <div class="stat">
              <div id="wallet-xdai" class="value"></div>
              <div class="label">xDAI</div>
            </div>
            <div class="stat">
              <div id="wallet-bzz" class="value"></div>
              <div class="label">xBZZ</div>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Teams</h2>
        <p id="no-teams" class="muted" hidden>No requests yet.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Batch ID</th>
                <th>IP</th>
                <th>Requested</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="teams"></tbody>
          </table>
        </div>
      </section>

      <p id="error" class="error"></p>
    </main>

    <script src="config.js"></script>
    <script>
      const API_URL = window.DISPENSER_API_URL
      const CREDENTIALS_KEY = 'dispenser-admin-credentials'
      const $ = id => document.getElementById(id)

      function loadCredentials() {
        try {
          return sessionStorage.getItem(CREDENTIALS_KEY)
        } catch {
          return null
        }
      }

      function saveCredentials(credentials) {
        try {
          credentials
            ? sessionStorage.setItem(CREDENTIALS_KEY, credentials)
            : sessionStorage.removeItem(CREDENTIALS_KEY)
        } catch {}
      }

      let credentials = loadCredentials()

      function showLogin(message = '') {
        credentials = null
        saveCredentials(null)
        $('dashboard').hidden = true
        $('logout').hidden = true
        $('login-form').hidden = false
        $('login-error').textContent = message
      }

      async function api(method, path, body) {
        const response = await fetch(`${API_URL}/admin/api/${path}`, {
          method,
          headers: { 'content-type': 'application/json', authorization: `Basic ${credentials}` },
          body: body ? JSON.stringify(body) : undefined,
        })

        if (response.status === 401) {
          showLogin('Wrong username or password')
          throw new Error('Unauthorized')
        }
        if (!response.ok) {
          const text = await response.text()
          throw new Error(text ? JSON.parse(text).error : response.statusText)
        }

        return response.status === 204 ? null : response.json()
      }

      function toLocalInput(iso) {
        const date = new Date(iso)
        return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16)
      }

      function cell(content) {
        const td = document.createElement('td')
        td.append(content)
        return td
      }

      function badge(text) {
        const span = document.createElement('span')
        span.className = `badge ${text}`
        span.textContent = text
        return span
      }

      function actionButton(label, action, id, style) {
        const button = document.createElement('button')
        button.textContent = label
        button.className = `small ${style}`
        button.addEventListener('click', () => runAction(action, id))
        return button
      }

      async function runAction(action, id) {
        if (action !== 'approve' && !confirm(`Really ${action} this team's token?`)) return

        try {
          const result = await api('POST', `teams/${id}/${action}`)

          if (result?.token) prompt('New token, hand it to the team:', result.token)
          await load()
        } catch (error) {
          $('error').textContent = error.message
        }
      }

      function renderTeams(teams) {
        $('no-teams').hidden = teams.length > 0
        $('teams').replaceChildren(
          ...teams.map(team => {
            const tr = document.createElement('tr')
            const name = cell(team.name)

            if (team.duplicate_name) {
              name.className = 'duplicate'
              name.title = 'Duplicate team name'
            }

            const batch = document.createElement('code')
            batch.textContent = team.batch_id ? `${team.batch_id.slice(0, 8)}…${team.batch_id.slice(-6)}` : '—'
            batch.title = team.batch_id ?? ''
            const actions = document.createElement('div')
            actions.className = 'actions'

            if (team.status === 'pending') actions.append(actionButton('Approve', 'approve', team.id, ''))
            if (team.status !== 'revoked') {
              actions.append(
                actionButton('Re-issue', 'reissue', team.id, 'secondary'),
                actionButton('Revoke', 'revoke', team.id, 'danger'),
              )
            }

            tr.append(
              name,
              cell(badge(team.status)),
              cell(batch),
              cell(team.ip ?? ''),
              cell(new Date(team.created_at).toLocaleString()),
              cell(actions),
            )
            return tr
          }),
        )
      }

      async function load(fillForm = false) {
        const state = await api('GET', 'state')
        $('login-form').hidden = true
        $('dashboard').hidden = false
        $('logout').hidden = false

        if (fillForm) {
          $('mode').value = state.settings.mode
          $('auto-until').value = state.settings.autoUntil ? toLocalInput(state.settings.autoUntil) : ''
        }
        $('mode-badge').textContent = state.settings.mode
        $('mode-badge').className = `badge ${state.settings.mode}`
        $('mode-status').textContent =
          state.settings.mode === 'auto'
            ? `Requests are approved automatically until ${new Date(state.settings.autoUntil).toLocaleString()}.`
            : 'Requests wait for approval.'
        $('pool-available').textContent = state.pool.available ?? 0
        $('pool-syncing').textContent = state.pool.syncing ?? 0
        $('pool-assigned').textContent = state.pool.assigned ?? 0
        $('pool-target').textContent = state.poolSize
        $('wallet-error').textContent = state.wallet.error ?? ''
        $('wallet').hidden = Boolean(state.wallet.error)

        if (!state.wallet.error) {
          $('wallet-address').textContent = state.wallet.address
          $('wallet-xdai').textContent = Number(state.wallet.xdai).toFixed(4)
          $('wallet-bzz').textContent = Number(state.wallet.bzz).toFixed(4)
        }
        renderTeams(state.teams)
      }

      $('settings-form').addEventListener('submit', async event => {
        event.preventDefault()
        $('error').textContent = ''

        try {
          const autoUntil = $('auto-until').value ? new Date($('auto-until').value).toISOString() : null
          await api('PUT', 'settings', { mode: $('mode').value, autoUntil })
          await load(true)
        } catch (error) {
          $('error').textContent = error.message
        }
      })

      $('login-form').addEventListener('submit', async event => {
        event.preventDefault()
        credentials = btoa(`${$('username').value}:${$('password').value}`)
        $('login-error').textContent = ''

        try {
          await load(true)
          saveCredentials(credentials)
        } catch (error) {
          if (credentials) $('login-error').textContent = `Login failed: ${error.message}`
        }
      })

      $('logout').addEventListener('click', () => showLogin())

      if (credentials) {
        load(true).catch(error => credentials && ($('error').textContent = error.message))
      } else {
        showLogin()
      }
      setInterval(() => credentials && load().catch(() => {}), 15000)
    </script>
  </body>
</html>
