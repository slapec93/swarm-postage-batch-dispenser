services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swarm_postage_batch_dispenser
      POSTGRES_PASSWORD: swarm_postage_batch_dispenser
      POSTGRES_DB: swarm_postage_batch_dispenser
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
